name: Generate Final APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies and Fix CLI
        run: |
          npm install --legacy-peer-deps
          npm install @react-native-community/cli --save-dev

      - name: Build APK Only
        run: |
          # البحث عن مجلد الأندرويد في أي مكان وبناء الـ APK
          ANDROID_DIR=$(find . -name android -type d | head -n 1)
          if [ -d "$ANDROID_DIR" ]; then
            cd "$ANDROID_DIR"
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            npx react-native build-android --mode release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My_Final_APK
          path: "**/*.apk"
