name: Global APK Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Find and Build APK
        run: |
          # البحث عن ملف gradlew في أي مكان داخل المشروع
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: Gradlew not found. Building with fallback..."
            npx react-native build-android --mode release
          else
            DIR=$(dirname "$GRADLEW_PATH")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleRelease
          fi

      - name: Upload APK Only
        uses: actions/upload-artifact@v4
        with:
          name: My_Final_APK
          path: "**/*.apk"
