name: Ultimate APK Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies and CLI
        run: |
          npm install --legacy-peer-deps
          npm install @react-native-community/cli --save-dev

      - name: Initialize Android Files
        run: |
          # ده بيحل مشكلة الملفات الناقصة و الـ CLI اللي ظهرت في الصورة
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || true
          
      - name: Build APK Only
        run: |
          # محاولة البناء المباشر وتخطي أخطاء المجلدات
          if [ -d "android" ]; then
            cd android
            [ -f gradlew ] || gradle init 
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
          else
            npx react-native build-android --mode release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My_App_APK
          path: "**/*.apk"
        with:
          name: My_App_APK
          path: "**/*.apk"
