name: Final APK Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Android Structure
        run: |
          # لو المجلد مش موجود حنعمله ونحط فيه ملفات التشغيل الأساسية
          mkdir -p android/app
          npx react-native ctx-clean || true
          
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build APK Only
        run: |
          # تنفيذ أمر بناء الـ APK مباشرة وتخطي أخطاء المجلدات
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || true
          cd android && chmod +x gradlew || echo "No gradlew found"
          ./gradlew assembleRelease || npx react-native build-android --mode release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My_App_APK
          path: "**/*.apk"
