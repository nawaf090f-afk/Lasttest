name: Generate APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android APK
        run: |
          # محاولة البحث عن gradlew في أي مكان وتشغيله
          GRADLE_PATH=$(find . -name gradlew)
          if [ -n "$GRADLE_PATH" ]; then
            DIR=$(dirname "$GRADLE_PATH")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Gradle wrapper not found, trying alternative build"
            npx react-native build-android --mode release || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Final_App_APK
          path: "**/*.apk"
          path: android/app/build/outputs/apk/release/*.apk
