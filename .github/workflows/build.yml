name: Build Web App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install and Build
        run: |
          npm install
          npm run build --if-present
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: .
